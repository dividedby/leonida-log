# Map regions (ADR 0010). Each is visible from the first mission: the map is open
# from the start and every region name is on the in-game map. Counties (Kelly
# County, Mariana County, Vice-Dale) are not areas. No districts yet; `parent`
# is in the schema for later.
#
# `aliases` are other names the text rule also treats as naming the region
# (lib/curated.data.test.ts): no item, optional mission, mission title,
# chapter name or gate entry may name a region before it is visible. Matching is
# case-insensitive on whole words.
#
# Evidence (ADR 0008): background only, never rendered. Visibility takes the
# latest plausible mission when sources split; here they agree on the open map.

