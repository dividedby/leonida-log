# Chapters and missions, in story order. Among the main missions (the 92 below)
# list position is the canonical order (mission order is derived from it, never
# stored here). Optional missions (any other kind) are listed after the mains,
# in a separate block at the end of the file; they have no order of their own,
# so adding or moving one never shifts a main mission or a gate.
#
# Source: a single guide, KeenGamer, "GTA 6 walkthrough: all chapters and story
# missions in order" (Ali Amir, 2026-11-19), accessed 2026-11-25.
# https://www.keengamer.com/articles/guides/gta-6-walkthrough-all-chapters-and-story-missions-in-order/
# Mission titles are facts; no guide text is copied. Order can vary a little in
# play.
#
# KeenGamer's 91 plus Pool Day (92) is canonical. KeenGamer omits Pool Day; IGN,
# PowerPyx and gtabase list it between Another Life and Company Cars (round 7,
# 2-late-chapter-missables#29). The count is in dispute (open question in
# docs/design.md):
#   - 91: KeenGamer, The Tab, Gamer Tweak (22/11/26/25/7 without Pool Day,
#     22/11/26/26/7 with it; Caught Slipping kept).
#   - 92: Gfinity; Game Rant says 91 in its lede and 92 in its intro.
#   - 93: Polygon (2026-11-20, "as they are listed in the game's Story Recap",
#     https://www.polygon.com/gta-6-mission-chapter-list-how-many/) and TalkEsport
#     (22/13/26/25/7). They add Thrillbillies, Twist Wrist, Smash, Grab and Kitty
#     Litter Labs and drop Caught Slipping. Polygon spells "Zorruso" (a typo) and
#     "Starting from Zero"; the game-text title of steal-the-zorrusso-for-randy is
#     "Clonin' Keys, Makin' Gs" (NotHGM game text, IGN), the old title was its first
#     objective. Slugs keep the old names.
#   - 95: VGC (adds the same three, keeps Caught Slipping).
# Game Rant and gtabase tag Billy's two jobs Optional; The Tab says it leaves out
# Optional-tagged entries. The save writes Thrillbillies and Twist Wrist, Smash,
# Grab as CompletionType 3 (counts for story completion and optional tasks), so
# both are optional (round 7, 6-first-hand-video-priority-sweep#2); that does not
# confirm Polygon's 93. Thrillbillies and Take Out Kitty Litter (Polygon Recap:
# Kitty Litter Labs) are entered below as optional missions. Twist Wrist, Smash,
# Grab stays out: its character and opens_after are unsourced. Round 4 checks
# against a completed in-game Story Recap.
#
# Second source, not adopted: gtabase's mission index
# (https://gtabase.com/gta-6/missions, accessed 2026-11-25) counts 109 story
# entries plus 26 optional ones, because it lists objective steps (e.g. "Deposit
# Cash Into BuckMe", "Prepare for Vice City") as missions, and its own chapter
# table disagrees with its numbered list. It also orders some missions
# differently from KeenGamer:
#   - Ch1: Gear Up, Unwanted Attention, Lab Fees, Pipework, Just a Scratch
#     (KeenGamer: Gear Up, Just a Scratch, Lab Fees, Unwanted Attention, Pipework).
#   - Ch3: South Leonida Real Estate comes far later (gtabase #70, KeenGamer Ch3 #6).
#   - Ch5: nine missions, adding Honest Abe and Unfinished Business before
#     Protective Custody and swapping VC Baby with Doggie Bag.
# Gate mission numbers (Tourist Trap 20, Checking Out 33, The Cartel Heist 59)
# follow KeenGamer's list; Sunset is mission 84 with Pool Day.

