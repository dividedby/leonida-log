  # Optional missions, listed after the 91 mains and grouped by chapter. They have
  # no order of their own: each opens after a mission (opens_after, a main mission
  # or another optional) and closes when the story reaches closes_at (a main
  # mission) or never. "Reached" means the player is on that mission, so standing
  # on closes_at counts as closed. closes_at may not be later than the last gate
  # in gates.yaml. The app derives checklist rows and countdowns from these
  # entries (lib/gates.ts); they replace the hand-written items they duplicated.
  #
  # Evidence rule: an entry ships only when kind, character, opens_after and
  # closes_at are all supported by two independent sources, one explicit non-AI
  # source, or first-hand video. Single AI-drafted sources (The Games Wiki,
  # egamers, gaming.net, pro-gamer.gg, happygamer) never count; Reddit is dropped.
  # `never` needs an affirmative statement; a page that is silent on a cutoff
  # does not prove it. Where guides give two cutoffs the earlier one is used (the
  # safe direction). `note` is app-voice text naming no mission past opens_after
  # except the gate.
  #
  # Not entered (no READY evidence; the matching items, where one exists, stay):
  #   - closes_at inferred or unconfirmed: Clock Out, Pick Up Groceries, Buy
  #     Flowers, Get The Chop, Find the Lost Drugs, Donnie's Lost Drugs,
  #     Impounded Vehicle, This Is a Free Call From..., Pick Up a Gun, Hit Avery
  #     Pawn, Collect Felipe's Gift (deadline inherited from Bad Driver!), Brother
  #     to Brother, Get Your Wheels, Attend Eddie Acosta's Party, It's A Date!,
  #     Dre'Quan's Gift.
  #   - disputed window: Meditate with Lucia, Race Against Yago, Donnie's Drop-Off.
  #   - never unproven (no guide states it stays open): Thrillbillies, Twist Wrist,
  #     Smash, Grab, Hit Kingpin Bowling, Kitty Litter Labs (kind also disputed)
  #     and about thirty more strangers, activities and repeatables. Thrillbillies,
  #     Twist Wrist, Smash, Grab and Kitty Litter Labs stay dispute-recorded here
  #     (see the count note above), not yet entered as missions.
  #   - opens_after is not a mission trigger: Check Out McKittrick Farm, Collect
  #     Chemicals for Kyle.
  #   - title or mapping unresolved: Bret's Hunting Decks, Steal Vehicles for
  #     Moses, Tail the Security Van, Randy's Wish List, Dunk's Robbery Tips.
  #   - Ambulance Chaser stays a main mission (Chapter 2, number 2): guides give
  #     it a cutoff, but a main mission carries none here, and making it optional
  #     would shift every later gate by one.
  #   - out of scope: Caught Slipping (already main), Honest Abe, Unfinished
  #     Business.
