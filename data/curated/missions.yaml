  # Optional missions, listed after the 92 mains and grouped by chapter. They have
  # no order of their own: each opens after a mission (opens_after, a main mission
  # or another optional) and closes when the story reaches closes_at (a main
  # mission) or never. "Reached" means the player is on that mission, so standing
  # on closes_at counts as closed. closes_at may not be later than the last gate
  # in gates.yaml. The app derives checklist rows and countdowns from these
  # entries (lib/gates.ts); they replace the hand-written items they duplicated.
  #
  # Evidence rule: an entry ships only when kind, character, opens_after and
  # closes_at are all supported by two independent sources, one explicit non-AI
  # source, or first-hand video. Single AI-drafted sources (The Games Wiki,
  # egamers, gaming.net, pro-gamer.gg, happygamer, gta6story.org, gtadb.io) never
  # count; Reddit is dropped. The Click and gta6heists are derivative of
  # gtabase/PowerPyx and count only as corroboration.
  # `never` needs an affirmative statement; a page that is silent on a cutoff
  # does not prove it. Round 7 category rule: Vandal and KeenGamer say side
  # strands are not lost except tagged exclusions; a strand entry takes closes_at
  # never only when its opens_after is sourced and no exclusion or soft-lock
  # warning names it. A character tag is display-only: no optional window is
  # shortened by a character lock. Where guides give two cutoffs the earlier one
  # is used (the safe direction). `note` is app-voice text naming no mission past opens_after
  # except the gate.
  #
  # Not entered (no READY evidence; the matching items, where one exists, stay):
  #   - closing mission not supported: Donnie's Lost Drugs, Impounded Vehicle,
  #     This Is a Free Call From... (timed), Pick Up a Gun, Hit Avery Pawn, Collect
  #     Felipe's Gift (deadline inherited from Bad Driver!), Brother to Brother, Get
  #     Your Wheels, It's a Date!, Dre'Quan's Gift, Dunk's Robbery Tips (title
  #     confirmed; opening disputed, after Slam Dunk per IGN and gta.guide vs Chapter 3
  #     per PowerPyx), Yasmani's ATM Jobs (timed: each job vanishes after 2-3 in-game
  #     days, GameWith 583812).
  #   - disputed window: Meditate with Lucia, Race Against Yago, Donnie's Drop-Off.
  #   - never unproven or sources missing: Twist Wrist, Smash, Grab (character and
  #     opens_after unsourced), Hit Kingpin Bowling, Search for Tree Effigies (its
  #     opens_after, Search for the Skunk Ape, has no READY entry) and the remaining
  #     strangers, activities and repeatables.
  #   - not missions of their own: Tail the Security Van (objective 1 of That's
  #     Where the Money Is..., the Chapter 4 optional after VCIA Takedown, plus
  #     repeatable Yasmani van tips).
  #   - Ambulance Chaser is settled as a main mission (Chapter 2, number 2; game text is
  #     the singular title, never recorded as optional in save data). Its cutoff is the
  #     Checking Out item ditch-the-ambulance (lost_at slam-dunk).
  #   - out of scope: Caught Slipping (already main), Honest Abe, Unfinished Business.
  #   - Renamed in game text: Bret's Hunting Decks is "Bret's Target Decks".
  #     "It's a Date!" has a lowercase a (PowerPyx writes "It's A Date!" - alias).
  #     "Steal Vehicles for Moses" title is confirmed on screen.
