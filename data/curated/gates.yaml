# Points of no return, keyed by the mission that triggers them.
# Four gates are listed; items exist for Tourist Trap (items/tourist-trap.yaml),
# Checking Out (items/checking-out.yaml), The Cartel Heist
# (items/the-cartel-heist.yaml) and Sunset (items/sunset.yaml).
# "lost" is paraphrased, never copied from a guide, and lists only what is
# lost; what a gate needs before it starts lives in the items. Mission replay doesn't
# exist, so a manual save before each gate is advised (see items/).
#
# The app shows each lost entry as a countdown ("Closes in N missions", "Do this
# before your next story mission"), computed from the gate's mission, and only
# for the next gate. A lost entry therefore never names a mission (ADR 0002,
# second amendment, 2026-11-26); lib/curated.data.test.ts enforces it. Optional
# missions that close at or before a gate are not listed here: they live in
# missions.yaml and the app derives their rows.
#
# Evidence (ADR 0008): every lost entry carries the current best-evidence value.
# Gates have no verified flag. A lost list resting on a single source is still
# shipped; its confidence is background and never rendered.
#
# Not a gate, owner decision 2026-11-27: Unfinished Business (Ch5). It is the last
# free roam before the ending, but nothing is lost there. PowerPyx says money you
# hold is lost when Protective Custody starts, while Family Savings is protected
# and returned later. After the credits the game reloads to just before Protective
# Custody with side missions, collectibles and 100% still open (PowerPyx, ItsCorey
# v-A4sXv54oo, Reddit r/GTA6unmoderated 1y3saga). Whether that reload restores held
# cash is unconfirmed. It is not a recap mission, see docs/design.md. It doesn't go into item text.
#
# Post-story: the Starlet Motel, the Bayside apartment and Y Hotel Suite 701 stay lost
# after the credits; the only post-story home is the Pegassi Towers penthouse
# (Sirloin -YRgIHb7QOo, PERSONAL map legend at 35:05:12; a gtabase reader comment agrees).
# After the credits the game returns the player to free roam outside Abe's office,
# just before Protective Custody, with the meeting postponed (ItsCorey v-A4sXv54oo at
# 23:08, Game8, PowerPyx). Signing Abe's deal loses the BuckMe checking balance and
# pocket cash; Family Savings is kept (Output Lag, PowerPyx).
# Not a curated entry: an item's visible_after_mission can't sit after the last gate
# (parseCurated rejects it), so the post-credits return point lives here only
# (open question in docs/design.md).
#
# Sunset: free roam is closed from Starting
# From Zero until the Honest Abe cutscene at the end of the closed stretch: it
# triggers the first time you leave the penthouse after Operation Savage Glory
# (gtabase, PowerPyx, WarFuel video 6:52). Checking shows $0 greyed out from the
# opening of Starting From Zero and is restored after Operation Savage Glory
# (frozen, not lost). Weapons, equipment and outfits come back at the end of
# Operation Savage Glory in the Pegassi penthouse (PowerPyx, gtabase, HUD toast).
# Suite 701 stops being home at the end of Starting From Zero (IGN, gtabase, PowerPyx).
# The Chapter 4/5 boundary is settled: Starting From Zero is the last Chapter 4
# mission and Bird in the Hand opens Chapter 5 (IGN, PowerPyx's full walkthrough as
# edited 2026-11-25, gtabase, KeenGamer). gtabase's Sunset page says starting it
# "moves the story into Chapter 5"; PowerPyx's "progresses into Chapter 5" means the
# same (no free roam), not that Sunset is a Chapter 5 mission.
# NOT listed because needs-confirmation: manual saves reported blocked during the
# stretch (one reporter); gtasixvicecity maps the point of no return to the mission
# after Sunset.
#
# Not lost at Tourist Trap: Key Lento shops (Rusty Anchor, The Siren's Chest, Chuck's). The area
# is hostile for part of Chapter 2, then reachable again (IGN, VGC); IGN's 100% guide
# still counts The Siren's Chest among the Smash 'n' Grabs. The Rusty Anchor merch
# stays in stock; only the Ring the Bell! offer ends.
#
# Tourist Trap: free roam returns after Recalibration; Chapter 1 free roam ends only when you approach Lucia, which starts Tourist Trap (IGN's Recalibration and Tourist Trap walkthroughs, gtabase, Leonipedia, VGC). PowerPyx's "last chance" sentence is templated on both pages and its own body contradicts it. Items use the gate itself as the line.
# The Cartel Heist: Beebom, gta.wiki (a fan MediaWiki with revision history) and
# gta6heists all say the Chapter 3 home is lost once it is done. Metaforge and
# Game8 put the apartment loss later than the heist, so doing everything before
# the heist is safe either way. gtabase's Ocean Beach page: the apartment is
# reachable after the heist and is lost when the next chapter starts; the heist
# bound in items is kept as the safe line.
# Ocean Beach (Chapter 4, first mission) is where the apartment is literally lost (Game8 638531, gtabase Ocean Beach, MetaForge Ch3; PowerPyx starts Ocean Beach at the apartment). The heist bound in items is kept as the safe line.

gates:
  - mission: tourist-trap
    lost:
      - Cash in your pockets
      - Your BuckMe checking balance
      - Jason's original house, and the cash stashed under its floor
      - All of Jason's vehicles at the house, his boat and the Ultimate Edition ones included
      - Free roam as Jason, for several hours
      - Brian's drug drop-off at his lockup, the last Chapter 1 fence
