# Points of no return, keyed by the mission that triggers them.
# Three gates are listed; items exist for Tourist Trap (items/tourist-trap.yaml),
# Checking Out (items/checking-out.yaml) and The Cartel Heist
# (items/the-cartel-heist.yaml).
# "lost" is paraphrased, never copied from a guide, and lists only what is
# lost; what a gate needs before it starts lives in the items. Mission replay doesn't
# exist, so a manual save before each gate is advised (see items/).
#
# Verification rule (items carry the verified flag; the same bar applies here):
# a single source that is AI-drafted or AI-assisted (The Games Wiki says so in
# its footer; gaming.net too) never counts as one explicit source. Lost-lists
# resting only on such a source are provisional.
#
# Not gates here, on purpose (owner decision: no new gates this round; both wait
# for round 4). Round 3 cross-checks make both look like points of no return:
#   - Sunset (Ch4): no free roam and no manual save from Sunset until Honest Abe
#     (GTA6BUGS, Leonida Hub citing RetroBroker; the manual-save part is one
#     reporter's claim). BuckMe checking shows $0 until Operation Savage Glory
#     (gameta, Leonida Hub, gta6helphub). Weapons, equipment and outfits are
#     returned after Operation Savage Glory (PowerPyx); where they are taken is
#     unconfirmed. Whether Suite 701 stops being a base is disputed.
#   - Unfinished Business (Ch5): signing Abe's deal loses checking and pocket
#     cash, while Family Savings is protected and returned later (Output Lag,
#     PowerPyx, both read).
# Neither goes into item text. See Open questions in docs/design.md.
#
# Tourist Trap: PowerPyx's Recalibration page says there is no free roam once
# you start Recalibration (two cross-checks read it), while its Tourist Trap page
# and VGC/gtabase tie the lock to Tourist Trap itself. Items use the earlier,
# safe line: finish and save before you start Recalibration.
# The Cartel Heist: Beebom, gta.wiki (a fan MediaWiki with revision history) and
# gta6heists all say the Chapter 3 home is lost once it is done. Metaforge and
# Game8 put the apartment loss later than the heist, so doing everything before
# the heist is safe either way.

gates:
  - mission: tourist-trap
    lost:
      - Cash in your pockets
      - Your BuckMe checking balance
      - Jason's original house, and the cash stashed under its floor
      - All of Jason's personal vehicles, Ultimate Edition ones included
      - Free roam as both characters, for several hours
    sources:
