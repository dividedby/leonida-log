# Points of no return, keyed by the mission that triggers them.
# Four gates are listed; items exist for Tourist Trap (items/tourist-trap.yaml),
# Checking Out (items/checking-out.yaml), The Cartel Heist
# (items/the-cartel-heist.yaml) and Sunset (items/sunset.yaml).
# "lost" is paraphrased, never copied from a guide, and lists only what is
# lost; what a gate needs before it starts lives in the items. Mission replay doesn't
# exist, so a manual save before each gate is advised (see items/).
#
# Verification rule (items carry the verified flag; the same bar applies here):
# a single source that is AI-drafted or AI-assisted (The Games Wiki says so in
# its footer; gaming.net too) never counts as one explicit source. Lost-lists
# resting only on such a source are provisional.
#
# Not a gate here, on purpose: Unfinished Business (Ch5). Signing Abe's deal
# loses checking and pocket cash, while Family Savings is protected and returned
# later (Output Lag, PowerPyx, both read). Owner decision: it waits for the
# mission-kinds PR; it is not a recap mission, see docs/design.md. It doesn't go
# into item text.
#
# Sunset: the lost list rests only on READY evidence. PowerPyx's Sunset page says
# most missions after it run before open world (R4-1/7 record 9, page read, no
# mention of Honest Abe); gtabase's Sunset page calls it a point of no return and
# says to finish side activities first (R4-3/5 2.3 #30, fetched).
# NOT listed because needs-confirmation:
#   - No free roam until Honest Abe exactly (GTA6BUGS relaying one Reddit
#     reporter, u/WanderW, "Unconfirmed"; Leonida Hub citing RetroBroker).
#   - Manual saves reported blocked (one player report, the same reporter).
#   - BuckMe checking reportedly shows $0 until Operation Savage Glory, then
#     returns (gameta, Leonida Hub, gta6helphub; the cross-check treats these as
#     guides only). Use "frozen", not "lost", if it is added later.
#   - Weapons, equipment and outfits taken at Sunset and returned at Operation
#     Savage Glory (PowerPyx; where they are taken is unconfirmed).
#   - Suite 701 as a base (disputed).
#   - gtasixvicecity maps the point of no return to the mission after Sunset.
# PowerPyx says Sunset moves the game into Chapter 5, while missions.yaml
# (KeenGamer) puts one more mission in Chapter 4, so the lost text avoids
# chapter numbers.
#
# Tourist Trap: PowerPyx's Recalibration page says there is no free roam once
# you start Recalibration (two cross-checks read it), while its Tourist Trap page
# and VGC/gtabase tie the lock to Tourist Trap itself. Items use the earlier,
# safe line: finish and save before you start Recalibration.
# The Cartel Heist: Beebom, gta.wiki (a fan MediaWiki with revision history) and
# gta6heists all say the Chapter 3 home is lost once it is done. Metaforge and
# Game8 put the apartment loss later than the heist, so doing everything before
# the heist is safe either way.

gates:
  - mission: tourist-trap
    lost:
      - Cash in your pockets
      - Your BuckMe checking balance
      - Jason's original house, and the cash stashed under its floor
      - All of Jason's personal vehicles, Ultimate Edition ones included
      - Free roam as both characters, for several hours
    sources:
