# Before-you-move-on items for the Sunset gate.
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two independent sources agree or one non-AI source
# states it outright. A single source that is AI-drafted or AI-assisted (The
# Games Wiki says so in its footer; gaming.net too) never counts as that one
# explicit source, so items resting only on it stay verified: false.
# Items here close before the gate in Chapter 4 or advise on the gate itself.
# Not listed, on purpose: manual-save loss (one report, unconfirmed). The $0
# checking freeze, the temporary loss of weapons, equipment and outfits, and Suite
# 701 as home are on the gate's lost list (gates.yaml); nothing here names a
# mission after Sunset.
# visible_after_mission for finish-before-sunset and sunset-manual-save has no
# source; both use ocean-beach, the first Chapter 4 mission.
# Bad Driver! is no longer an item: it is an optional mission in missions.yaml
# (opens after Party Hard, closes at Power Play) and the app derives its row.
# Collect Felipe's Gift stays an item: its deadline is inherited from Bad
# Driver! (neither gtabase nor PowerPyx states one for the Gift itself), so it
# has no READY mission entry; lost_at power-play is the safe bound.

items:
  - id: finish-before-sunset
    title: Finish free roam before Sunset
    category: General
    before_gate: sunset
    # Visibility point not sourced; first Chapter 4 mission.
    visible_after_mission: ocean-beach
    lost_at_mission: sunset
    verified: true
    how_to: "PowerPyx says most of the missions after Sunset run before open world returns, and gtabase says starting Sunset moves the story into Chapter 5 and to finish side activities first. Wrap up any jobs and collectibles you want in free roam before you start it. Your bank balance is frozen for most of it, so keep some cash on you."
    sources:
      - url: https://www.powerpyx.com/gta-6-sunset-stop-by-the-front-desk-walkthrough/
        title: "PowerPyx: Sunset (Stop by the Front Desk) walkthrough"
        accessed: "2026-11-26"
      - url: https://www.gtabase.com/gta-6/missions/sunset
        title: "gtabase: Sunset mission"
        accessed: "2026-11-26"

  - id: sunset-manual-save
    title: Make a manual save before Sunset
    category: General
    before_gate: sunset
    # Visibility point not sourced; set to ocean-beach per lead decision.
    visible_after_mission: ocean-beach
    verified: true
    how_to: There's no mission replay, so keep a save you won't overwrite. Make a fresh manual save during your last free roam before Sunset, since free roam stays closed for a long stretch afterwards.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-6-walkthrough-all-chapters-and-story-missions-in-order/
        title: "KeenGamer: GTA 6 walkthrough, all chapters and story missions in order"
        accessed: "2026-11-25"
      - url: https://www.powerpyx.com/gta-6-grand-theft-auto-vi/
        title: "PowerPyx: GTA 6 trophy guide and roadmap"
        accessed: "2026-11-25"
      - url: https://www.powerpyx.com/gta-6-sunset-stop-by-the-front-desk-walkthrough/
        title: "PowerPyx: Sunset (Stop by the Front Desk) walkthrough"
        accessed: "2026-11-26"
      - url: https://www.gtaboom.com/gta-6-has-a-new-save-system-and-will-not-let-you-replay-story-missions-fa48
        title: "GTABoom: new save system, no mission replay"
        accessed: "2026-11-26"

  - id: collect-felipes-gift
    title: Collect Felipe's Gift
    category: Side missions
    before_gate: sunset
    visible_after_mission: heavy-lifting
    lost_at_mission: power-play
    verified: false
    evidence:
      basis: best-guess
      note: "Gamers Heroes names Lost Heaven Cemetery instead of the Millport chapel."
    how_to: "Only appears if you didn't get the full $10M at the Cartel Heist and then spare Felipe in Bad Driver!. It closes at the same point as that job, before Sunset, so collect it first. Felipe texts you where he left his Declasse '80 Impaler, by a chapel in Millport; it sells for about $2,450."
    location: By a chapel in Millport.
    sources:
