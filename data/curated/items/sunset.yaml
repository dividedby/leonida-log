  - id: relationship-before-sunset
    title: Get your relationship to level 3 before Sunset
    category: Romance
    before_gate: sunset
    visible_after_mission: ocean-beach
    lost_at_mission: sunset
    verified: true
    evidence:
      basis: two-sources
      note: "IGN's and PowerPyx's Starting From Zero pages give the staying-together talk right after Sunset and its branches. Level 2's name is split (Partners in Crime in IGN, VGC, Polygon, GamesRadar and Eurogamer; Not So Hot elsewhere), so the text gives numbers only. MetaForge says relationship and savings decide the ending; PowerPyx says only the final choice does (out of scope)."
    how_to: Right after Sunset, Jason and Lucia talk about whether to stay together. At level 3 or 4 of 4 the breakup option never comes up; at level 2 you can refuse it, and at level 1 Lucia raises it and a timeout agrees. A breakup is permanent, so reach level 3 first by answering her calls, spending time together and never leaving her behind.
    sources:
      - url: https://www.ign.com/wikis/gta-6/Starting_From_Zero_Walkthrough
        title: "IGN: Starting From Zero walkthrough"
        accessed: "2026-11-26"
      - url: https://www.powerpyx.com/gta-6-starting-from-zero-walkthrough/
        title: "PowerPyx: Starting From Zero walkthrough"
        accessed: "2026-11-26"
      - url: https://www.videogameschronicle.com/guide/gta-6-jason-lucia-relationship-levels-explained-how-to-improve-jason-and-lucias-relationship/
        title: "VGC: Jason and Lucia relationship levels explained"
        accessed: "2026-11-26"

  - id: ultimate-edition-squalo
    title: Claim the Ultimate Edition Shitzu Squalo boat
    category: Vehicles
    before_gate: sunset
    visible_after_mission: ocean-beach
    lost_at_mission: sunset
    verified: false
    evidence:
      basis: safe-bound
      note: "PowerPyx says it is only available during Chapter 4 (copied by Tech4Gamers, egamers, Consolyte and gtabase); GameSpot, GamesRadar+, VGC, Red Bull and Game8 EN give no expiry, and no source names a closing mission, so the chapter gate is used. Location and opening are settled."
    how_to: If you own the Ultimate Edition, claim the Shitzu Squalo from the canal dock just left of the Y Hotel on Washington Beach during this chapter, before the gate.
    location: Washington Beach canal, just left of the Y Hotel.
    sources:
      - url: https://www.ign.com/wikis/gta-6/Chapter_4_Walkthrough_and_Guide
        title: "IGN: Chapter 4 walkthrough and guide"
        accessed: "2026-11-26"
