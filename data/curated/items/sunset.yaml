# Before-you-move-on items for the Sunset gate.
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two independent sources agree or one non-AI source
# states it outright. A single source that is AI-drafted or AI-assisted (The
# Games Wiki says so in its footer; gaming.net too) never counts as that one
# explicit source, so items resting only on it stay verified: false.
# Items here close before the gate in Chapter 4 or advise on the gate itself.
# Not listed, on purpose: manual-save loss (one report, unconfirmed). The $0
# checking freeze, the temporary loss of weapons, equipment and outfits, and Suite
# 701 as home are on the gate's lost list (gates.yaml); nothing here names a
# mission after Sunset.
# Headliners brass knuckles: not missable, sold at Ammu-Nation for $95 (MetaForge weapons database) whichever way the Bush bump goes. The Making Gainz steroid choice only changes Lucia's look while her Fitness is 5 or higher (IGN, PowerPyx); no data field holds it (a main mission can't carry a note).
# visible_after_mission for finish-before-sunset and sunset-manual-save is ocean-beach: IGN's Ocean Beach walkthrough says the Hang Out free roam after The Cartel Heist leads into Ocean Beach, and gtabase puts Ocean Beach next.
# Bad Driver! is no longer an item: it is an optional mission in missions.yaml
# (opens after Party Hard, closes at Power Play) and the app derives its row.
# Collect Felipe's Gift stays an item: its deadline is inherited from Bad
# Driver! (neither gtabase nor PowerPyx states one for the Gift itself);
# lost_at power-play is the safe bound.

items:
  - id: finish-before-sunset
    title: Finish free roam before Sunset
    category: General
    before_gate: sunset
    # Visibility point not sourced; first Chapter 4 mission.
    visible_after_mission: ocean-beach
    lost_at_mission: sunset
    verified: true
    how_to: "PowerPyx says most of the missions after Sunset run before open world returns, and gtabase says starting Sunset moves the story into Chapter 5 and to finish side activities first. Wrap up any jobs and collectibles you want in free roam before you start it. Your bank balance is frozen for most of it, so keep some cash on you."
    sources:
      - url: https://www.powerpyx.com/gta-6-sunset-stop-by-the-front-desk-walkthrough/
        title: "PowerPyx: Sunset (Stop by the Front Desk) walkthrough"
        accessed: "2026-11-26"
      - url: https://www.gtabase.com/gta-6/missions/sunset
        title: "gtabase: Sunset mission"
        accessed: "2026-11-26"
      - url: https://www.ign.com/wikis/gta-6/Ocean_Beach_Walkthrough
        title: "IGN: Ocean Beach walkthrough"
        accessed: "2026-11-26"
      - url: https://www.gtabase.com/gta-6/missions/ocean-beach
        title: "gtabase: Ocean Beach mission"
        accessed: "2026-11-26"

  - id: sunset-manual-save
