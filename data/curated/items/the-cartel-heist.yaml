      note: "Game8 JP, GameWith, gtabase and The Click say a timer ends it; a couple of guides say it lasts until the chapter ends. No source names a closing mission, so the chapter end is only an upper bound."
    how_to: "It's a timed hourglass job in Vice City. Pick the Freeway Run race; the payout depends on where you finish, $3,800 for first and $1,500 for second. Race it as soon as the hourglass shows up: the timer ends it partway through the chapter. A PSNProfiles forum trophy guide says missing it means Yago's line of jobs can't be finished. Missing it won't cost you the Strangers & Freaks trophy: that needs 8 strands and there are more than enough without Yago."
