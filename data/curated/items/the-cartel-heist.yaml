  - id: race-against-yago
    title: Win Race Against Yago when the hourglass appears
    category: Side missions
    before_gate: the-cartel-heist
    visible_after_mission: welcome-to-vice-city
    lost_at_mission: the-cartel-heist
    verified: true
    how_to: It's a timed hourglass job in Vice City that pays $3,800 for first place. Race it as soon as the hourglass shows up. It closes with the chapter, and a player-written trophy guide says missing it means Yago's line of jobs can't be finished. The Tab says the reward is a pistol instead of cash, so guides disagree there.
