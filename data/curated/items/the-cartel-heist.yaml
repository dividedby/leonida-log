  - id: vanessas-laptop
    title: Solve Vanessa's laptop for a free garage and car
    category: Vehicles
    before_gate: the-cartel-heist
    visible_after_mission: welcome-to-vice-city
    lost_at_mission: the-cartel-heist
    verified: true
    evidence:
      basis: safe-bound
      note: "IGN gives the sell value as $22,660; MetaForge saw about $20,600. The lower figure is shown."
    how_to: "In the Bayside apartment bedroom, log in to the laptop with the password Muffins, Queen, and 15, then use the code from the message at the garage. Drive the pink Pfister Growler out to register it for free; it sells for about $20,600. The laptop only works this chapter and the apartment is lost when the next one starts, so claim the car before the heist."
    location: Bayside Safehouse bedroom; Del Rio Boulevard Garage, La Perle.
    sources:
