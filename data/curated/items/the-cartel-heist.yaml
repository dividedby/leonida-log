  - id: halifax-callback
    title: Finish things with Halifax
    category: Side missions
    before_gate: the-cartel-heist
    visible_after_mission: dubious-provenance
    lost_at_mission: the-cartel-heist
    verified: true
    how_to: Halifax has a three-part job that starts in Dubious Provenance. If you didn't hand him the statue in Part 1, call him back before Chapter 3 ends to unlock Parts 2 and 3. Guides differ on which branch carries the callback, and it closes at the gate, so make it before then.
