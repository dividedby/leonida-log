  - id: halifax-callback
    title: Finish things with Halifax
    category: Side missions
    before_gate: the-cartel-heist
    visible_after_mission: dubious-provenance
    lost_at_mission: the-cartel-heist
    verified: true
    how_to: Take Halifax's offer in Dubious Provenance. If you turn him down, he has an optional callback that closes at the gate, so make it before then.
