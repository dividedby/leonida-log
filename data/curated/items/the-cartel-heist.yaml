# Before-you-move-on items for The Cartel Heist gate (Chapter 3 finale).
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two independent sources agree or one non-AI source
# states it outright. A single source that is AI-drafted or AI-assisted (The
# Games Wiki says so in its footer; gaming.net too) never counts as that one
# explicit source, so items resting only on it stay verified: false.
# visible_after_mission is the earliest sourced mission. The Bayside items use
# welcome-to-vice-city, which gta.wiki gives as the Bayside Safehouse unlock.
# Race Against Yago is triggered by the side job Bumper to Bumper, which isn't in
# our 91-mission list, so it also uses the first Chapter 3 mission. The home goes with the gate, so
# everything inside it is lost_at_mission: the-cartel-heist.
# Timing: gtabase says the apartment is reachable after the heist and is lost when
# the next chapter starts; Beebom (self-contradicting), Wanted State,
# gta6playertools and gta6heists put the loss at or right after the heist;
# Metaforge and Game8 (unread by the reviewer) put it later. LOST stays
# the-cartel-heist as the safe bound; items say 'before the heist' and never name
# the next chapter's first mission.
# Spoiler rule (ADR 0002, 2026-11-26): text never names a later mission;
# cutoffs live in lost_at_mission.
# Race Against Yago: gtabase and The Click say only the timer ends it; other
# guides say it closes with the chapter; The Tab says the reward is a pistol, not
# cash. The item stays unverified and keeps the heist as the safe bound.
# Not listed, on purpose: what happens in The Cartel Heist itself, the $120,000
# payout, the crates item (Vice Missions only), the bank-job and Yasmani items,
# and codes (Beebom prints the garage code; the safe code is unverified).

items:
  - id: vanessas-laptop
    title: Solve Vanessa's laptop for a free garage and car
    category: Vehicles
    before_gate: the-cartel-heist
    visible_after_mission: welcome-to-vice-city
    lost_at_mission: the-cartel-heist
    verified: true
    how_to: In the Bayside apartment bedroom, log in to the laptop with the password Muffins, Queen, and 15, then use the code from the message at the garage. Drive the Pfister Vanessa's Growler out to register it for free; Beebom prices it at about $22,660. The apartment is lost for good once the next chapter starts, so claim the car before the heist to be safe.
    location: Bayside Safehouse bedroom; Del Rio Boulevard Garage, La Perle.
    sources:
      - url: https://beebom.com/gta-6-chapter-3-missables-items/
        title: "Beebom: GTA 6 Chapter 3 missables"
        accessed: "2026-11-25"
