  - id: halifax-callback
    title: Finish things with Halifax
    category: Side missions
    before_gate: the-cartel-heist
    visible_after_mission: dubious-provenance
    lost_at_mission: the-cartel-heist
    verified: true
    how_to: "If you turned down Halifax's offer for the statue, he texts about a day later. Call him and agree before this chapter ends, or the rest of his job is gone for good. If he doesn't pick up, keep calling. If you handed the statue over, nothing expires here, but finishing his job before the heist is the safe line."
