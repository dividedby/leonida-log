# Before-you-move-on items for The Cartel Heist gate (Chapter 3 finale).
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two independent sources agree or one non-AI source
# states it outright. A single source that is AI-drafted or AI-assisted (The
# Games Wiki says so in its footer; gaming.net too) never counts as that one
# explicit source, so items resting only on it stay verified: false.
# visible_after_mission is the earliest sourced mission. The Bayside items use
# welcome-to-vice-city, which gta.wiki gives as the Bayside Safehouse unlock.
# Race Against Yago is triggered by the side job Bumper to Bumper (an optional
# mission in missions.yaml), so it also uses the first Chapter 3 mission. The home
# goes with the gate, so everything inside it is lost_at_mission: the-cartel-heist.
# Timing: gtabase says the apartment is reachable after the heist and is lost when
# the next chapter starts; Beebom (self-contradicting), Wanted State,
# gta6playertools and gta6heists put the loss at or right after the heist;
# Metaforge and Game8 (unread by the reviewer) put it later. LOST stays
# the-cartel-heist as the safe bound; items say 'before the heist' and never name
# the next chapter's first mission.
# Spoiler rule (ADR 0002, 2026-11-26): text never names a later mission;
# cutoffs live in lost_at_mission.
# Race Against Yago: a timer ends it, partway through Chapter 3 (Game8 JP,
# GameWith, gtabase, The Click); some guides say it closes with the chapter. No
# source names a closing mission, so the heist is an upper bound. Reward settled by
# footage: $3,800 for first (Freeway Run), $1,500 for second; The Tab's pistol
# claim is an outlier. The item stays unverified.
# Not listed, on purpose: what happens in The Cartel Heist itself, its payout (IGN:
# $150,000 first deposit for a perfect getaway with all 10 stacks, $100,000
# otherwise; PowerPyx and Rare Thief's own save show $120,000; unreconciled), the
# crates item (Vice Missions only), the bank-job and Yasmani items,
# and codes (Beebom prints the garage code; the safe code is unverified).

items:
  - id: vanessas-laptop
    title: Solve Vanessa's laptop for a free garage and car
    category: Vehicles
    before_gate: the-cartel-heist
    visible_after_mission: welcome-to-vice-city
    lost_at_mission: the-cartel-heist
    verified: true
    how_to: "In the Bayside apartment bedroom, log in to the laptop with the password Muffins, Queen, and 15, then use the code from the message at the garage. Drive the pink Pfister Growler out to register it for free; IGN gives its sell value as $22,660, and MetaForge saw about $20,600. The laptop only works this chapter and the apartment is lost when the next one starts, so claim the car before the heist to be safe."
    location: Bayside Safehouse bedroom; Del Rio Boulevard Garage, La Perle.
    sources:
      - url: https://beebom.com/gta-6-chapter-3-missables-items/
        title: "Beebom: GTA 6 Chapter 3 missables"
        accessed: "2026-11-25"
      - url: https://www.gtabase.com/gta-6/missions/ocean-beach
        title: "gtabase: Ocean Beach mission"
        accessed: "2026-11-26"
      - url: https://www.ign.com/wikis/gta-6/Laptop_Password_and_Aunties_Place_La_Perle_Location
        title: "IGN: laptop password and Auntie's place, La Perle"
        accessed: "2026-11-26"
      - url: https://metaforge.app/gta-6/gta-6-vanessas-laptop-password-free-growler
        title: "MetaForge: Vanessa's laptop password and free Growler"
        accessed: "2026-11-26"

