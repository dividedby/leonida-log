  - id: ch3-jason-switch-softlock
    title: Save before finishing Missing Persons in Chapter 3
    category: General
    before_gate: the-cartel-heist
    visible_after_mission: welcome-to-vice-city
    verified: true
    evidence:
      basis: first-hand
      note: "Sir Grotti's clip and video show it, GTA6Bugs collects 290 reports, and Rockstar's 01.002.002 notes list no fix; Polygon and Output Lag relay the same reports. Other fallbacks (call Dunk from Lucia's phone, or play a Lucia or duo mission) are left out."
    how_to: "A known bug, not a cutoff. If you finish the Kelly County Missing Persons case as Jason early in this chapter, you can end up stuck as Lucia with Jason greyed out on the switch wheel while the next story mission needs him. Sleeping or reloading the autosave doesn't clear it, and update 01.002.002 didn't fix it. Make a manual save before its final warehouse meeting. If you're already stuck, load that save, play the next Jason story mission until free switching returns, then finish the case."
    sources:
      - url: https://gta6bugs.com/bugs/gta-6-chapter-3-jason-greyed-out-softlock-after-missing-persons
        title: "GTA6Bugs: Chapter 3 softlock, Jason greyed out (bug #0261)"
        accessed: "2026-11-26"
      - url: https://x.com/SirrGrotti/status/2125331777233498124
        title: "Sir Grotti on X: Chapter 3 soft-lock clip"
        accessed: "2026-11-26"
      - url: https://www.youtube.com/watch?v=KMvjW-NyC-s
        title: "Sir Grotti: This GTA 6 Bug Could RUIN Your Entire Save (Softlock)"
        accessed: "2026-11-26"
      - url: https://support.rockstargames.com/articles/sN5pEdFYZdlvijKXd6xpJ/grand-theft-auto-vi-launch-updates-ps5-xbox-series-x-or-s
        title: "Rockstar Support: Grand Theft Auto VI launch updates"
        accessed: "2026-11-26"
      - url: https://www.polygon.com/gta-6-soft-lock-bug-chapter-3-game-breaking/
