  - id: avery-kingpin-jobs
    title: Take the Avery Pawn and Kingpin Bowling jobs
    category: Side missions
    before_gate: checking-out
    visible_after_mission: coffee-break
    verified: false
    how_to: "Both are robberies rather than stranger jobs, offered around Coffee Break, and Eurogamer says they pay plenty of cash and unique gear, which helps toward the $15,000. Kingpin Bowling is a Kolt & Associates operation, and IGN, Vice City Tracker and PowerPyx all name the Gutterball Moreland 850 as a key valuable looted inside it, on the north-east pool table. PowerPyx says the alley can be hit again in Chapter 3 after a cooldown. No source gives cash amounts."
    location: Avery Pawn Shop and Kingpin Bowling Alley.
    sources:
