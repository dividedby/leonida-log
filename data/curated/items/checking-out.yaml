  - id: motel-storage
    title: Empty the motel's wardrobe and storage
    category: General
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    lost_at_mission: checking-out
    verified: true
    how_to: Wear the outfits you want and take out anything you stored there. You lose the motel as a home at the gate.
    location: Starlet Motel.
    sources:
