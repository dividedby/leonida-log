  - id: dominator-buggy
    title: Pick up the '67 Dominator Buggy (Ultimate Edition)
    category: Vehicles
    before_gate: checking-out
    visible_after_mission: afternoon-delight
    verified: true
    how_to: "After Billy's Thrillbillies job, Wyman texts and marks a garage on the map (IGN calls it the Paradise RV Park garage; Tech4Gamers says Grassrivers, about a day later). Collect the buggy there; Rockstar's edition text says it's kept at the Paradise Garage in Watson Bay."
    location: "Marked garage in Grassrivers, Mariana County (IGN: Paradise RV Park garage); Paradise Garage, Watson Bay."
    sources:
      - url: https://gta.tech4gamers.com/gta-6/vehicles/67-vapid-dominator-buggy/
        title: "Tech4Gamers: '67 Vapid Dominator Buggy"
        accessed: "2026-11-25"
      - url: https://www.ign.com/wikis/gta-6/Wyman%27s_Cars_(Ultimate_Edition_Exclusive)
        title: "IGN: Wyman's Cars (Ultimate Edition exclusive)"
        accessed: "2026-11-26"
