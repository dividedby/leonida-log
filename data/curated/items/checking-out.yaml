        title: "PowerPyx: GTA 6 pool opponent locations"
        accessed: "2026-11-25"

  - id: night-encounter
    title: Find the secret midnight encounter
    category: Side missions
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    verified: true
    how_to: From Chapter 2 on, go to the Circles of Hell House on Gellhorn Avenue between midnight and 4 AM. Either character can do it, alone. It pays out the Hellspawn Comshot 12 shotgun and a permanent max-health increase. The shotgun isn't added to your inventory by itself, so pick it up before you leave.
    location: Circles of Hell House, Gellhorn Avenue, northern Port Gellhorn.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-6-satan-mission-walkthrough-and-hellspawn-shotgun/
        title: "KeenGamer: GTA 6 Satan mission walkthrough and Hellspawn shotgun"
        accessed: "2026-11-25"
      - url: https://www.gtabase.com/gta-6/weapons/hellspawn-comshot-12
        title: "gtabase: Hellspawn Comshot 12"
        accessed: "2026-11-25"

  - id: billy-thrillbillies
    title: Do Billy's Thrillbillies and Twist Wrist, Smash, Grab
    category: Side missions
    before_gate: checking-out
    visible_after_mission: coffee-break
    verified: true
    how_to: Most guides tag both as optional, though Polygon lists them as main missions. Either way they pay well, so do them. Thrillbillies unlocks after Coffee Break, per PowerPyx, and pays up to $2,500 depending on how you place. Twist Wrist, Smash, Grab pays $2,000. Both help toward the $15,000.
    sources:
