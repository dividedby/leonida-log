  - id: delights-pool
    title: Beat the pool opponent at Delights Cabaret
    category: Side missions
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    lost_at_mission: afternoon-delight
    verified: true
    how_to: Delights Cabaret closes shortly before the gate and reopens later in the story, so missing it is temporary. Some guides put the closure at the end of the chapter, so earlier is the safe line. PowerPyx says five of the seven pool opponents are needed for 100%, while IGN says you'll need to clear every table.
    location: Delights Cabaret, Port Gellhorn.
    sources:
