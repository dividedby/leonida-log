  - id: delights-pool
    title: Beat the pool opponent at Delights Cabaret
    category: Side missions
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    lost_at_mission: afternoon-delight
    verified: true
    how_to: Delights Cabaret closes after Afternoon Delight and reopens later in the story, so missing it is temporary. Some guides put the closure at the end of the chapter, so before Afternoon Delight is the safe line. Five of the seven pool opponents are needed for 100%.
    location: Delights Cabaret, Port Gellhorn.
    sources:
      - url: https://game8.co/games/GTA-6/archives/640492
        title: "Game8: Delights Cabaret closing and reopening"
        accessed: "2026-11-25"
      - url: https://getvicekeys.com/guides/gta-6-delights-dancers-cards
        title: "Vice Keys: Delights dancers and cards"
        accessed: "2026-11-25"
