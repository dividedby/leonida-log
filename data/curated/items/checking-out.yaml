  - id: partner-workouts
    title: Work out with your partner
    category: Stats
    before_gate: checking-out
    visible_after_mission: coffee-break
    verified: true
    how_to: "Partner workouts unlock once you can switch characters freely, after Coffee Break. When your partner follows you into a gym workout they finish their own automatically, so both characters train at once; How to Video Game saw this for Strength and Cardio. The Personal Best trophy needs maximum Strength on both characters, and working out together is the efficient route, not a requirement."
