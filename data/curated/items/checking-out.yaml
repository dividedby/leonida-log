  - id: bret-hunting
    title: Meet Bret for the hunting jobs (Jason only)
    category: Side missions
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    verified: false
    how_to: Veteran Hunted is Jason-only and starts near Mount Kalaga. It pays $500 and hands over a Killtelligence SM-69 sniper, and it starts the hunting line. One checklist places the hunting after the chapter, so treat the timing as approximate.
    location: Near Mount Kalaga.
    sources:
      - url: https://bloxodes.com/wiki/gta-6/strangers-and-freaks
