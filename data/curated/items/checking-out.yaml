        accessed: "2026-11-25"

  - id: moses-car-sales
    title: Sell cars to Moses
    category: Money
    before_gate: checking-out
    visible_after_mission: moses
    verified: true
    how_to: "Steal cars with no tracker and sell them to Moses. Pay varies a lot with the car: the scan card shows the sell value, such as $1,150 for an Imponte '77 Phoenix and $7,645 for a Vapid Firebug Dominator (GazzaMontana's footage), while typical early cars are worth only around $400 (HarmNone) and GTABoom gives $1,000 to $3,000. PowerPyx puts the cooldown between sales at about two minutes; other reports differ. Take them from the main road in Port Gellhorn rather than near his garage. It's slow for big money but fine for reaching $15,000."
    location: Moses' auto shop, Port Gellhorn.
    sources:
      - url: https://www.powerpyx.com/?p=370489
        title: "PowerPyx: GTA 6 money guide"
        accessed: "2026-11-25"
      - url: https://www.gtaboom.com/how-to-make-money-fast-and-early-in-gta-6-725c
        title: "GTABoom: how to make money fast and early in GTA 6"
        accessed: "2026-11-25"
      - url: https://www.youtube.com/watch?v=tRqfScxuczg
        title: "GazzaMontana (YouTube): Moses scan cards, sell values at 02:09 and 03:10"
        accessed: "2026-11-26"
      - url: https://www.youtube.com/watch?v=u5Rq9VpNOhg
        title: "HarmNone (YouTube): early Moses car values, 04:07"
        accessed: "2026-11-26"

  - id: range-focus
    title: Train Focus at Rodgers Ranch
    category: Focus
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    verified: true
    how_to: Pay the $5 waiver and play the Market Range Beginner challenge. It takes about five seconds, gives Focus every time and repeats if you pick Quit on the results screen. Finishing or quitting a range challenge raises Focus permanently, by at least 4% according to Polygon. There are 12 challenges across the two ranges and 42 golds in all. Focus never decays.
    location: Rodgers Ranch & Shooting Range, north-east edge of Port Gellhorn.
    sources:
