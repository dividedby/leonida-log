  - id: night-encounter
    title: Find the secret midnight encounter
    category: Side missions
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    verified: true
    how_to: From Chapter 2 on, go to the Circles of Hell House on Gellhorn Avenue between midnight and 2 AM; most guides say the window runs to 4 AM, but midnight to 2 AM is inside every report. Either character can do it, alone. It pays out the Hellspawn Comshot 12 shotgun and a permanent max-health increase. The shotgun isn't added to your inventory by itself, so pick it up before you leave.
    location: Circles of Hell House, Gellhorn Avenue, northern Port Gellhorn.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-6-satan-mission-walkthrough-and-hellspawn-shotgun/
        title: "KeenGamer: GTA 6 Satan mission walkthrough and Hellspawn shotgun"
        accessed: "2026-11-25"
      - url: https://www.gtabase.com/gta-6/weapons/hellspawn-comshot-12
