    title: Start Kyle McKittrick's farm jobs
    category: Side missions
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    verified: true
    how_to: "Check Out McKittrick Farm pays $400. Collect Chemicals for Kyle pays $1,000 and gives mutated strawberries. The $5,000 price is only one option: IGN lists $5,000, $3,000 or free by negotiating, so you can start it without paying. Game8 and games.gg say the first strawberry permanently raises max Stamina and later ones are temporary buffs of unknown length."
