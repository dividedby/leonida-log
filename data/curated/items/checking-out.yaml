# Before-you-move-on items for the Checking Out gate.
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two independent sources agree or one non-AI source
# states it outright. A single source that is AI-drafted or AI-assisted (The
# Games Wiki says so in its footer; gaming.net too) never counts as that one
# explicit source, so items resting only on it stay verified: false.
# visible_after_mission is the earliest sourced mission; where no later mission
# is sourced it is the first Chapter 2 mission (whats-in-the-bag).
# Registered cars: Leonida Streets says registered vehicles are kept at Checking
# Out; one Reddit comment (unverified, unusable alone) says they're impounded.
# Sources conflict, so no item lists them as lost (see register-car).
# Thrillbillies and Twist Wrist, Smash, Grab aren't in missions.yaml (the 91
# list); Polygon lists them as main missions, most guides tag them optional.
# The mission count is an open question (docs/design.md).
# Motel magazine: PowerPyx and Game Checklists say "Wizard Wang". Jacob Fox's
# video description (first-hand; description read, not the on-screen text), two
# other videos and gta6collectiblesmap say "Children of Wizard Wang". The item
# keeps "Wizard Wang" until someone reads the on-screen text.
# delights-pool uses lost_at_mission: afternoon-delight although the closure is
# temporary (Game8, Vice Keys and Game Checklists all say it reopens later).
# Not listed, on purpose: what to do for Lucia during the escape. It can't be
# described without giving away the mission.

items:
  - id: save-fifteen-thousand
    title: Save $15,000
    category: Money
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    verified: false
    how_to: gtabase says Checking Out won't start until you hold $15,000 and have finished every other main mission. IGN says the $15,000 isn't necessary and only makes the mission unlock sooner. Nobody has tested it first-hand, so aim for $15,000 in your BuckMe checking account to be safe. No source says it's spent or whether pocket cash counts.
    location: The BuckMe app.
    sources:
      - url: https://www.gtabase.com/gta-6/missions/checking-out
        title: "gtabase: Checking Out mission"
        accessed: "2026-11-25"
      - url: https://thegameswiki.com/gta6/wiki/missable-content-and-points-of-no-return
        title: "The Games Wiki: missable content and points of no return"
        accessed: "2026-11-25"
      - url: https://www.ign.com/wikis/gta-6/Checking_Out_Walkthrough
        title: "IGN: Checking Out walkthrough"
        accessed: "2026-11-26"

  - id: finish-chapter-2-missions
    title: Finish every other main mission
    category: General
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    verified: true
    how_to: Checking Out also waits for every other available main mission in the chapter. Money alone won't trigger it. Missions can arrive by phone, so sleep to move time on if none are showing.
    sources:
      - url: https://www.gtabase.com/gta-6/missions/checking-out
        title: "gtabase: Checking Out mission"
        accessed: "2026-11-25"
      - url: https://thegameswiki.com/gta6/wiki/missable-content-and-points-of-no-return
        title: "The Games Wiki: missable content and points of no return"
        accessed: "2026-11-25"
      - url: https://www.keengamer.com/articles/guides/gta-6-walkthrough-all-chapters-and-story-missions-in-order/
        title: "KeenGamer: GTA 6 walkthrough, all chapters and story missions in order"
        accessed: "2026-11-25"

  - id: motel-cards
    title: Collect the 3 cards and 2 magazines in the motel
    category: Collectibles
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    lost_at_mission: checking-out
    verified: true
    how_to: The Starlet Motel holds three collectible cards, Vicki, Victor Maravilla and Bryson Powers, plus two magazines, Help Me, Help You, Help Me and Wizard Wang. The motel stops being your home at the gate. IGN lists an open-world copy of each card, so the motel copies may not be needed to complete the sets, but take them anyway while you can.
    location: Starlet Motel. Vicki is in the office bathroom, Victor Maravilla in the communal kitchen fridge and Bryson Powers in the laundry room washing machine. The magazines are at the reception desk and the cafeteria counter.
    sources:
      - url: https://leonidastreets.com/gta-6-checking-out-walkthrough/
        title: "Leonida Streets: Checking Out walkthrough"
        accessed: "2026-11-25"
