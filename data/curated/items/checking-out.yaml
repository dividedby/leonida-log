  - id: register-car
    title: Register a car with Moses and add garages
    category: Vehicles
    before_gate: checking-out
    visible_after_mission: daily-driver
    verified: true
    how_to: "Moses only registers cars with no tracker. Get the car resprayed at his shop, then register it. The first registration is free, and each one after that costs a fee based on the car's value. You need an empty garage slot: the free Port Gellhorn Station Garage unlocks after Daily Driver, and the Real Estate app sells more; the cheapest is Mitchell Auto Center at $5,000, or $4,000 with BuckMe Gold (which needs $100,000 in Family Savings). Pay 'n' Spray takes cars with a standard tracker, but only later in the story. Whether registered cars survive Checking Out isn't confirmed, so don't rely on it."
    location: Moses' auto shop, Port Gellhorn.
    sources:
