  - id: motel-pool-weights
    title: Use the free weights by the motel pool
    category: Stats
    before_gate: checking-out
    visible_after_mission: ambulance-chaser
    lost_at_mission: checking-out
    verified: false
    how_to: "While the Starlet Motel is your base in Chapter 2, its pool area has a weight bench, kettlebells and a squat rack you can use for free to train Strength, so you don't need a gym membership yet. Either character can use them. One tested guide says nothing is locked out there after the gate, so treat this as a convenience, not a must-do."
    location: Starlet Motel, by the pool fence and loungers.
    sources:
      - url: https://www.youtube.com/watch?v=TuuspTxxL0w
        title: "Accelerated Ideas (YouTube): Chapter 2 gym location, Strength Workout on screen 0:03 and 0:58"
        accessed: "2026-11-26"
      - url: https://www.youtube.com/watch?v=n4kwhHoDzcY
        title: "Games & Apps Tutorials (YouTube): workout at the Starlet Motel, squat rack 0:26"
        accessed: "2026-11-26"
      - url: https://www.ign.com/wikis/gta-6/Chapter_2_Walkthrough_and_Guide
