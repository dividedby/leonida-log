# Before-you-move-on items for the Checking Out gate.
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two independent sources agree or one non-AI source
# states it outright. A single source that is AI-drafted or AI-assisted (The
# Games Wiki says so in its footer; gaming.net too) never counts as that one
# explicit source, so items resting only on it stay verified: false.
# visible_after_mission is the earliest sourced mission; where no later mission
# is sourced it is the first Chapter 2 mission (whats-in-the-bag).
# Registered cars: kept at Checking Out but impounded in Port Gellhorn at the
# start of the next chapter (GamesRadar team test), recoverable in person or via
# Scooter Bros Premium. Rare Thief (own save) and KeenGamer also say kept; Leonida
# Streets and Gamertag Mythras cite KeenGamer (one origin). PowerPyx has owned cars
# parked at the new safehouse (mild conflict).
# Thrillbillies is an optional mission (save CompletionType 3) entered in
# missions.yaml; Twist Wrist, Smash, Grab stays out until its character and
# opens_after are sourced. The mission count is an open question (docs/design.md).
# Motel magazine: the cover reads Children of Wizard Wang on screen (Cavaliers
# Gaming footage, round 5 cross-check); PowerPyx and Game Checklists shorten it to
# Wizard Wang, which is likely the collectible-list label.
# Spoiler rule (ADR 0002, 2026-11-26): text never names a later mission;
# cutoffs live in lost_at_mission.
# Veteran Hunted, Thrillbillies, Check Out McKittrick Farm, Collect Chemicals for
# Kyle, Steal Vehicles for Moses and the Circles of Hell encounter are no longer
# items: they are optional missions in missions.yaml that stay open after the
# story, so they show under "safe to leave". moses-car-sales (open-ended sales)
# stays an item.
# Not listed, on purpose: what to do for Lucia during the escape. It can't be
# described without giving away the mission.

items:
  - id: save-fifteen-thousand
    title: Save $15,000
    category: Money
    before_gate: checking-out
    visible_after_mission: afternoon-delight
    verified: true
    how_to: "Banking $15,000 is the in-game Prepare for Vice City objective, and most guides (PowerPyx, gtabase, gta6bugs) say Checking Out won't start until you have it and have finished every other main mission. IGN says the $15,000 isn't necessary and only makes the mission unlock sooner. Bank it in your BuckMe checking account: guides say it has to be banked rather than carried, and pocket cash is lost if you die or get arrested. No source says the money is spent."
    location: The BuckMe app.
    sources:
      - url: https://www.gtabase.com/gta-6/missions/checking-out
        title: "gtabase: Checking Out mission"
        accessed: "2026-11-25"
      - url: https://thegameswiki.com/gta6/wiki/missable-content-and-points-of-no-return
        title: "The Games Wiki: missable content and points of no return"
        accessed: "2026-11-25"
      - url: https://www.ign.com/wikis/gta-6/Checking_Out_Walkthrough
        title: "IGN: Checking Out walkthrough"
        accessed: "2026-11-26"
      - url: https://www.powerpyx.com/gta-6-prepare-for-vice-city-walkthrough/
        title: "PowerPyx: Prepare for Vice City walkthrough"
        accessed: "2026-11-26"
      - url: https://www.gtaboom.com/gta-6-prepare-for-vice-city-walkthrough-1e7b
        title: "GTABoom: Prepare for Vice City walkthrough"
        accessed: "2026-11-26"

