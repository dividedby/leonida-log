    how_to: Veteran Hunted is Jason-only and starts near Mount Kalaga. It pays $500 and hands over a Killtelligence SM-69 sniper, and it starts the hunting line, which gtabase and PowerPyx place some time after Coffee Break. PowerPyx's checklist says the hunting line stays available after the story.
