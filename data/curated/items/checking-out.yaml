  - id: register-car
    title: Register a car with Moses and add garages
    category: Vehicles
    before_gate: checking-out
    visible_after_mission: daily-driver
    verified: true
    how_to: "Moses only registers cars with no tracker. Get the car resprayed at his shop, then register it. The first registration is free; KeenGamer says later ones cost a fee based on the car's value. To keep more cars you need an empty garage slot: buy garages in the Real Estate app, the cheapest at about $4,000. Pay 'n' Spray takes cars with a standard tracker, but only later in the story. Registered cars stay yours after the gate, but they start the next chapter in the Port Gellhorn impound: collect them once the town's heat dies down, or have Scooter Bros Premium fetch one, which uses all three free daily drop-offs (GamesRadar team test; KeenGamer and Rare Thief say they carry over)."
    location: Moses' auto shop, Port Gellhorn.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-vi-how-to-register-personal-cars-and-vehicles/
