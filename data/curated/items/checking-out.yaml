  - id: motel-cards
    title: Collect the 3 cards and 2 magazines in the motel
    category: Collectibles
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    lost_at_mission: checking-out
    verified: true
    how_to: The Starlet Motel holds three collectible cards, Vicki, Victor Maravilla and Bryson Powers, plus two magazines, Help Me, Help You, Help Me and Children of Wizard Wang (the cover reads this on screen; some guides shorten it to Wizard Wang). The motel stops being your home at the gate. IGN lists an open-world copy of each card, so the motel copies may not be needed to complete the sets, and guides disagree on whether the magazines have copies elsewhere, so take them all while you can.
    location: Starlet Motel. Vicki is in the office bathroom, Victor Maravilla in the communal kitchen fridge and Bryson Powers in the laundry room washing machine. The magazines are at reception and in the cafeteria.
    sources:
