  - id: motel-pool-weights
    title: Use the free weights by the motel pool
    category: Stats
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    lost_at_mission: checking-out
    verified: false
    how_to: In Chapter 2 the Starlet Motel has free weights by the pool, with no gym membership needed, so you can train Strength without paying for a studio. They go with the motel at the gate. The loss is inferred from the motel closing, and the two sources are small fan sites.
    location: Starlet Motel, by the pool.
    sources:
      - url: https://getvicekeys.com/guides/gta-6-starlet-motel-pool-workout
        title: "Vice Keys: Starlet Motel pool workout"
        accessed: "2026-11-25"
      - url: https://www.gta-xtreme.com/en/gta-6-chapter-2-gym-location
        title: "GTA Xtreme: Chapter 2 gym location"
        accessed: "2026-11-25"

  - id: moses-car-sales
    title: Sell cars to Moses
    category: Money
    before_gate: checking-out
    visible_after_mission: moses
    verified: true
    how_to: Steal cars with no tracker and sell them for roughly $1,000 to $3,000 each, with about a two-minute cooldown between sales. Take them from the main road in Port Gellhorn rather than near his garage. It's slow for big money but fine for reaching $15,000.
    location: Moses' auto shop, Port Gellhorn.
    sources:
      - url: https://www.powerpyx.com/?p=370489
        title: "PowerPyx: GTA 6 money guide"
        accessed: "2026-11-25"
      - url: https://www.gtaboom.com/how-to-make-money-fast-and-early-in-gta-6-725c
        title: "GTABoom: how to make money fast and early in GTA 6"
        accessed: "2026-11-25"

  - id: range-focus
    title: Train Focus at Rodgers Ranch
    category: Focus
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    verified: true
    how_to: Pay the $5 waiver and play the Market Range Beginner challenge. It takes about five seconds, gives Focus every time and repeats if you pick Quit on the results screen. Finishing or quitting a range challenge raises Focus permanently, by at least 4% according to Polygon. There are 12 challenges across the two ranges and 42 golds in all. Focus never decays.
    location: Rodgers Ranch & Shooting Range, north-east edge of Port Gellhorn.
    sources:
      - url: https://thephrasemaker.com/2026/11/19/all-stats-how-to-increase-them-in-gta-6/
        title: "The Phrasemaker: all stats and how to increase them in GTA 6"
        accessed: "2026-11-25"
