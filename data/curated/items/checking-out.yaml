  - id: dominator-buggy
    title: Pick up the '67 Dominator Buggy (Ultimate Edition)
    category: Vehicles
    before_gate: checking-out
    visible_after_mission: coffee-break
    verified: true
    how_to: About a day after Billy's Thrillbillies job, Wyman texts and a purple task appears on the map (Tech4Gamers; IGN also has Wyman texting after Thrillbillies). Collect the buggy from the marked garage in Grassrivers, Mariana County, which IGN calls the Paradise RV Park garage, then keep it in the Paradise Garage in Watson Bay.
    location: "Marked garage in Grassrivers, Mariana County (IGN: Paradise RV Park garage); Paradise Garage, Watson Bay."
    sources:
      - url: https://gta.tech4gamers.com/gta-6/vehicles/67-vapid-dominator-buggy/
        title: "Tech4Gamers: '67 Vapid Dominator Buggy"
        accessed: "2026-11-25"
      - url: https://www.ign.com/wikis/gta-6/Wyman%27s_Cars_(Ultimate_Edition_Exclusive)
        title: "IGN: Wyman's Cars (Ultimate Edition exclusive)"
        accessed: "2026-11-26"
