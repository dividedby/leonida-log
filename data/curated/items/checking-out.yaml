  - id: partner-workouts
    title: Work out with your partner
    category: Stats
    before_gate: checking-out
    visible_after_mission: coffee-break
    verified: true
    how_to: Partner workouts unlock after Coffee Break. When your partner follows you into a workout they finish their own automatically, so both characters train at once; Strength is confirmed and the other stats are unclear. The Personal Best trophy needs maximum Strength on both characters, and working out together is the efficient route, not a requirement.
    sources:
      - url: https://www.polygon.com/gta-6-fitness-app-gym-health-focus-stamina/
