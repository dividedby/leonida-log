  - id: dominator-buggy
    title: Pick up the '67 Dominator Buggy (Ultimate Edition)
    category: Vehicles
    before_gate: checking-out
    visible_after_mission: whats-in-the-bag
    verified: true
    how_to: About a day after Billy's Thrillbillies job, Wyman texts and a purple task appears on the map. Collect the buggy from the marked garage in Grassrivers, Mariana County, then keep it in the Paradise Garage in Watson Bay.
    location: Grassrivers garage, Mariana County; Paradise Garage, Watson Bay.
    sources:
      - url: https://gta.tech4gamers.com/gta-6/vehicles/67-vapid-dominator-buggy/
        title: "Tech4Gamers: '67 Vapid Dominator Buggy"
        accessed: "2026-11-25"
