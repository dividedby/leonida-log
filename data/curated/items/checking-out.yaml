  - id: motel-cards
    title: Collect the 3 cards and 2 magazines in the motel
    category: Collectibles
    before_gate: checking-out
    visible_after_mission: ambulance-chaser
    lost_at_mission: checking-out
    verified: true
    how_to: The Starlet Motel holds three collectible cards, Vicki, Victor Maravilla and Bryson Powers, plus two magazines, Help Me, Help You, Help Me and Children of Wizard Wang (the cover reads this on screen; some guides shorten it to Wizard Wang). The motel stops being your home at the gate. IGN lists an open-world copy of each card, so the motel cards aren't your only chance at the sets; take the magazines and cards while you can.
    location: Starlet Motel. Vicki is in the office bathroom, Victor Maravilla in the communal kitchen fridge and Bryson Powers in the laundry room washing machine. The magazines are at reception and in the cafeteria.
