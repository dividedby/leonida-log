  - id: family-savings-goal
    title: Put $5,000 into Family Savings
    category: Money
    before_gate: tourist-trap
    visible_after_mission: buck-me
    verified: true
    how_to: "Aim for $5,000, the first Family Savings goal and the Chapter 1 cap (Rock Paper Shotgun, KeenGamer). BuckMe won't let a deposit go past the current goal: in ABTW's footage the transfer's Maximum stops at exactly the amount that reaches $5,000. Family Savings can't be withdrawn or lost, and each savings level raises how much your checking account can hold (PowerPyx)."
    location: The BuckMe app, once the account is set up.
    sources:
      - url: https://www.rockpapershotgun.com/gta-6-how-to-keep-your-money-at-end-of-chapter-1
