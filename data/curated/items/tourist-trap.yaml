  - id: shirley-side-missions
    title: Do Shirley's two hourglass missions
    category: Side missions
    before_gate: tourist-trap
    visible_after_mission: prologue
    lost_at_mission: tourist-trap
    verified: true
    how_to: Look for the hourglass markers and do both, Get Shirley's Rum and Steal the Scooter. Both close when the gate starts. The rum run reportedly rewards Focus and a Professional profile bump, and the scooter lets Jason borrow Shirley's Penumbra. Neither affects trophies or 100%.
