  - id: collect-cards
    title: Collect the cards
    category: Collectibles
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    evidence:
      basis: best-guess
      note: "AllThings says unsold cards sit in a box in the safehouse; Game8 EN says money stored in the house and goods stored in the car are lost at the gate. No source says what happens to the box's cards, so they are treated as tied to the house."
    how_to: There are 18 card sets with 480 cards in all, and each colour variant counts as its own card. You can't buy them. Duplicates sell at pawn shops for roughly $20 to over $1,000, and selling a card doesn't remove it from your progress. One challenge asks for three in each of the five counties. Set progress isn't urgent, but sell your duplicates before the gate instead of leaving them in the safehouse box.
    location: Indoors on surfaces and walls, outdoors in yellow phone boxes and on tool boxes.
    sources:
      - url: https://www.powerpyx.com/gta-6-all-collectible-card-sets-locations/
