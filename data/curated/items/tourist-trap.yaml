  - id: spend-on-weapons
    title: Spend spare cash on weapons
    category: Money
    before_gate: tourist-trap
    visible_after_mission: buck-me
    verified: true
    evidence:
      basis: best-guess
      note: "Nova Gaming (eISm7aTurTY) says weapons carry over at 3:04 and warns against leaving anything in the trunk at 3:12; bought ammo, armor and explosives sit in the car's trunk (Output Lag). No source links ammo to a gate."
    how_to: "Bought weapons carry through Tourist Trap, per Playtheory's own save and Output Lag, and unique variants are kept for good, so spare pocket cash is best spent on guns. Weapons you pick up off enemies aren't owned and are lost if you die or get arrested. Attachments you buy carry over too (Playtheory's own save; Jay Dunna), but they're tracked separately for each character, so Lucia's copy of a gun doesn't get Jason's mods (Nova Gaming; gameta). Don't count on ammo or bought clothes coming with you: Playtheory lost its bought clothes."
    location: Chuck's Tackle & Shot in Key Lento, or any Ammu-Nation. Bought guns can be kept in the weapon locker inside the gun store (Rock Paper Shotgun).
    sources:
      - url: https://playtheorymedia.com/gta-6-before-you-finish-chapter-1/
