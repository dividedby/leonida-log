  - id: family-savings-goal
    title: Put $5,000 into Family Savings
    category: Money
    before_gate: tourist-trap
    visible_after_mission: buck-me
    verified: true
    how_to: Every guide that gives a target says at least $5,000 before the gate. Family Savings can't be withdrawn or lost, and hitting the goal raises how much your checking account can hold.
    location: The BuckMe app, once the account is set up.
