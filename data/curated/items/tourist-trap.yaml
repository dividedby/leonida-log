# Before-you-move-on items for the Tourist Trap gate.
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two independent sources agree or one non-AI source
# states it outright. A single source that is AI-drafted or AI-assisted (The
# Games Wiki says so in its footer; gaming.net too) never counts as that one
# explicit source, so items resting only on it stay verified: false.
# Where guides disagree the item ships the safe value and the disagreement goes in
# evidence.note (ADR 0008); verified is research background only.
# Checking balance: Rock Paper Shotgun, IGN's All Chapter 1 Missables and
# Playtheory's own save say it is lost, so empty-checking is verified.
# Lock-in: free roam returns after Recalibration, and Chapter 1 free roam ends
# only when you approach Lucia, which starts Tourist Trap (IGN's Recalibration
# and Tourist Trap walkthroughs, gtabase, Leonipedia, VGC). PowerPyx's "last
# chance" sentence is templated on both pages and its own body contradicts it.
# finish-before-recalibration is verified and has no lost_at; keep its id
# (item_checks keys on it).
# Not listed, on purpose: the Moreland 850 pickup inside Tourist Trap itself.
# It can't be described without giving away the mission, and it falls after
# the lock-in point.
# Outfits: Playtheory's own save kept only the starting outfit; gameta says
# wardrobe-saved accessories can be had again; IGN's Tourist Trap walkthrough and
# KeenGamer say cosmetics carry over, so bought-outfits stays unverified.
# Collections tabs: guides disagree (PowerPyx lists five).
# Donnie's Drop-Off: Game8 puts the end later than Game Checklists and The Games
# Wiki (an AI-drafted lead); lost_at uses the earlier line and the item is
# unverified.
# Spoiler rule (ADR 0002, 2026-11-26): text never names a later mission;
# cutoffs live in lost_at_mission.
# Not items any more: Get Shirley's Rum, Steal the Scooter, Ring the Bell!, Clock
# Out, Get Lucia's Clothes, Buy Lucia a Necklace, Pick Up Groceries, Buy Flowers,
# Get The Chop and Find the Lost Drugs are optional missions in missions.yaml; the
# app derives their rows and countdowns. Donnie's Drop-Off and Meditate with Lucia
# stay items: lost_at is the earliest plausible cutoff (Clear Skies; the Tourist
# Trap gate for the one-shot balcony offer).
# Pickups inside a mission are lost_at the next main mission (reached rule):
# mandys-cigars (Pipework), donnies-38 (Don Gone).
# Chuck's discount, the card box and spend-on-weapons ammo: no source settles them;
# the safe advice is in the text and the split is in evidence.note.
# Stats: levels are tracked on /stats (ADR 0009), so there are no "Train X" items.
# Only what a gate takes away is listed: jason-gym (the back-deck gym goes with the
# house). Cardio has no gate-tied facility and Focus never decays, so neither has
# an item. jason-gym replaced `strength`; the old id's ticks are ignored.

