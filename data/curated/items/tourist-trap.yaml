  - id: collect-cards
    title: Collect the cards
    category: Collectibles
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: There are 18 card sets with 480 cards in all, and each colour variant counts as its own card. You can't buy them. Duplicates sell at pawn shops for roughly $20 to over $1,000, and selling a card doesn't remove it from your progress. One challenge asks for three in each of the five counties. Set progress isn't urgent, but AllThings says unsold cards sit in a box in your safehouse and no guide says what happens to them at the gate, so sell duplicates before the gate to be safe.
    location: Indoors on surfaces and walls, outdoors in yellow phone boxes and on tool boxes.
    sources:
      - url: https://www.powerpyx.com/gta-6-all-collectible-card-sets-locations/
