  - id: spend-on-weapons
    title: Spend spare cash on weapons
    category: Money
    before_gate: tourist-trap
    visible_after_mission: buck-me
    verified: true
    how_to: Bought weapons carry through Tourist Trap, per Playtheory's own save and Output Lag, and unique variants are kept for good, so spare pocket cash is best spent on guns. Weapons you pick up off enemies aren't owned and are lost if you die or get arrested. Whether ammo, attachments and clothes carry over is still unconfirmed.
