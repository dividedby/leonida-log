# Before-you-move-on items for the Tourist Trap gate.
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two sources agree or one states it outright.

items:
  - id: manual-save
    title: Make a manual save
    category: General
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: true
    how_to: There's no mission replay, so keep a save you won't overwrite. Do it before you start the next mission.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-6-walkthrough-all-chapters-and-story-missions-in-order/
        title: "KeenGamer: GTA 6 walkthrough, all chapters and story missions in order"
        accessed: "2026-11-25"

  - id: bank-your-cash
    title: Bank your cash
    category: Money
    before_gate: tourist-trap
    visible_after_mission: buck-me
    lost_at_mission: tourist-trap
    verified: true
    how_to: Move what's in your pockets into the family savings account. The guide suggests keeping at least $5,000 safe.
    location: Banking, once the account is set up.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-6-walkthrough-all-chapters-and-story-missions-in-order/
        title: "KeenGamer: GTA 6 walkthrough, all chapters and story missions in order"
        accessed: "2026-11-25"

  - id: ultimate-edition-vehicles
    title: Drive the Ultimate Edition vehicles
    category: Vehicles
    before_gate: tourist-trap
    visible_after_mission: prologue
    lost_at_mission: tourist-trap
    verified: true
    how_to: Drive the Ultimate Edition cars while you still have them. They're gone after the gate.
    sources:
      - url: https://www.videogameschronicle.com/guide/gta-6-chapter-1-warning-read-this-before-finishing-chapter-1-of-gta-6/
        title: "VGC: GTA 6 Chapter 1 warning, read this before finishing Chapter 1"
        accessed: "2026-11-25"

  - id: finish-exploring
    title: Finish exploring and side activities
    category: General
    before_gate: tourist-trap
    visible_after_mission: prologue
    lost_at_mission: tourist-trap
    verified: true
    how_to: Wrap up anything you want to do as both characters. Free roam with the pair stops for several hours.
    sources:
      - url: https://www.videogameschronicle.com/guide/gta-6-chapter-1-warning-read-this-before-finishing-chapter-1-of-gta-6/
        title: "VGC: GTA 6 Chapter 1 warning, read this before finishing Chapter 1"
        accessed: "2026-11-25"

  - id: strength
    title: Train Strength
    category: Stats
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: Lift weights, including the ones on the house terrace, or pay for a studio session. Finish the fitness app workout or the gains don't count.
    location: House terrace weights and paid studios.
    sources:
      - url: https://www.powerpyx.com/gta-6-how-to-increase-character-stats-health-cardio-focus/
        title: "PowerPyx: GTA 6 stats guide"
        accessed: "2026-11-25"

  - id: cardio
    title: Train Cardio
    category: Stats
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: Use the treadmill or a bike, or run, cycle and swim.
    sources:
      - url: https://www.powerpyx.com/gta-6-how-to-increase-character-stats-health-cardio-focus/
        title: "PowerPyx: GTA 6 stats guide"
        accessed: "2026-11-25"

  - id: focus
    title: Train Focus
    category: Focus
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: Practise at the shooting range (a small waiver fee, repeatable), or play golf, pool or fishing. Headshots on psychopath-profile targets count too.
    sources:
      - url: https://www.powerpyx.com/gta-6-how-to-increase-character-stats-health-cardio-focus/
        title: "PowerPyx: GTA 6 stats guide"
        accessed: "2026-11-25"

  - id: collect-cards
    title: Collect the cards
    category: Collectibles
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: Pick up all 18. Keep them in the safehouse box until you sell them at the pawn shop. Three in each county is a challenge of its own.
    location: Safehouse box, then the pawn shop.
    sources:
      - url: https://allthings.how/how-many-collectibles-are-in-gta-6-and-where-to-track-them/
        title: "AllThings.how: GTA 6 collectibles guide"
        accessed: "2026-11-25"

  - id: balcony-meditation
    title: Accept Lucia's balcony invite
    category: Romance
    before_gate: tourist-trap
    visible_after_mission: down-to-earth
    verified: false
    how_to: The morning after Down to Earth, at Jason's house, say yes when Lucia asks you to meditate on the balcony. It may count toward a trophy, and it isn't available later.
    location: Jason's house.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-6-walkthrough-all-chapters-and-story-missions-in-order/
        title: "KeenGamer: GTA 6 walkthrough, all chapters and story missions in order"
        accessed: "2026-11-25"

  - id: shirley-side-missions
    title: Do Shirley's side missions
    category: Side missions
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: Look for the hourglass markers and do both Shirley jobs, the rum run and the scooter. They're missable.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-6-walkthrough-all-chapters-and-story-missions-in-order/
        title: "KeenGamer: GTA 6 walkthrough, all chapters and story missions in order"
        accessed: "2026-11-25"
