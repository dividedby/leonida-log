  - id: bank-your-cash
    title: Empty your pockets
    category: Money
    before_gate: tourist-trap
    visible_after_mission: buck-me
    lost_at_mission: tourist-trap
    verified: true
    how_to: Cash in your pockets is lost at the gate. Spend it on things you'll keep or pay it into BuckMe, and keep your pockets at $0. Shops take pocket cash only up to about $1,000 (PowerPyx) and bill BuckMe for the rest, so there's no reason to carry any.
