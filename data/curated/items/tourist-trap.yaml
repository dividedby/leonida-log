    how_to: Use the treadmill or a bike, or run, cycle and swim. Polygon gives Cardio the same limits as Strength, and gta6pedia restates it, at about 11% per exercise, nine to a level, a 33% daily cap, a window of about four days before gains are lost, protein halving the wait and a top level of 4, with smaller gains per exercise as you level. Don't count on Jason's Cardio gains lasting past the next chapter change.
