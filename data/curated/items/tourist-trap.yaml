  - id: strength
    title: Train Strength
    category: Stats
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    evidence:
      basis: safe-bound
      note: "GameSight's PS5 save shows Strength dropping at the chapter change while Cardio and Focus stay; The Games Wiki says all his fitness levels drop."
    how_to: "Lift weights on Jason's back deck or pay for a studio session, and finish the workout or the gains don't count. Polygon's numbers (gta6pedia restates Polygon) are about 11% per successful exercise, nine exercises to a level, a 33% daily cap (so three a day) and a top level of 4; Polygon adds that gains per exercise shrink as you level. After a workout the next window opens in about a day, or half that with protein, and stays open about four days; miss it and the gains are lost. Jason's back-deck gym goes with the house at the gate, per How to Video Game and GameSpot. Don't count on Jason's Strength gains from this chapter lasting past the next chapter change."
    location: Jason's back deck and paid studios.
    sources:
      - url: https://www.polygon.com/gta-6-fitness-app-gym-health-focus-stamina/
        title: "Polygon: GTA 6 fitness app, gym, health, Focus and stamina"
