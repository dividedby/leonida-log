  - id: ultimate-edition-vehicles
    title: Drive the Ultimate Edition vehicles
    category: Vehicles
    before_gate: tourist-trap
    visible_after_mission: prologue
    lost_at_mission: tourist-trap
    verified: true
    how_to: Drive the Ultimate Edition vehicles while you still have them, including the Dinka Enduro and Crest Kayak at the safehouse and the Ganado Retro Build at Coastal Auto Care. VGC says the Ultimate Edition ones go after the gate, and one guide says all of Jason's personal vehicles do.
    location: Jason's safehouse; Coastal Auto Care.
    sources:
