  - id: house-magazines
    title: Grab the magazines in Jason's house
    category: Collectibles
    before_gate: tourist-trap
    visible_after_mission: prologue
    lost_at_mission: tourist-trap
    verified: false
    how_to: Five magazines sit inside the house and go with it, so read them while you're there. Each has a copy somewhere else. Body Copy is in the Zenith gym in Downtown and the Ajax Gym on Oldby Island. Off the Hook is in a house on Surfside Dr in Key Lento and a mobile home in Port Gellhorn. Orca is at a tiki bar south of Southwind, and players report Ashes of Glory in several places. Lethal By Design's only other copy is on a warehouse table during a later story mission, so read it in the house. 100% needs 30 of the titles.
    location: Inside Jason's house. Ashes of Glory in the bedroom, Lethal By Design on the living-room table, Orca A Whole Different Animal by the east window, Off the Hook in the tool shed and Body Copy on the back deck.
