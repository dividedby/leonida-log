    verified: false
    how_to: Five magazines sit inside the house and go with it, so read them all before the gate. Orca and Off the Hook have second copies documented elsewhere, though guides disagree on Orca, and Lethal By Design has none documented. Whether the rest can be replaced is unconfirmed, so treat all five as one-time.
    location: Inside Jason's house. Ashes of Glory in the bedroom, Lethal By Design on the living-room table, Orca A Whole Different Animal by the east window, Off the Hook in the tool shed and Body Copy on the back deck.
