  - id: strength
    title: Train Strength
    category: Stats
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: true
    how_to: Lift weights on Jason's back deck or pay for a studio session, and finish the fitness app workout or the gains don't count. Polygon's numbers, which gta6pedia matches, are about 11% per successful exercise, nine exercises to a level, a 33% daily cap (so three a day) and a top level of 4. After a workout the next window opens in about a day, or half that with protein, and stays open about four days; miss it and the gains are lost. Jason's back-deck gym is lost with the house at Tourist Trap, per GameSpot and Game Checklists. GameSight's own PS5 gameplay (a video and a matching article) shows Jason's Strength falling from 4 to 1 at the chapter change, with Cardio and Focus reported kept and no figures given; it's one creator's save, so Chapter 1 Strength gains shouldn't be counted on.
    location: Jason's back deck and paid studios.
    sources:
      - url: https://www.polygon.com/gta-6-fitness-app-gym-health-focus-stamina/
