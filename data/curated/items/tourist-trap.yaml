  - id: collect-cards
    title: Collect the cards
    category: Collectibles
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: There are 18 card sets with 480 cards in all, and each colour variant counts as its own card. You can't buy them. Duplicates sell at pawn shops for roughly $20 to over $1,000, and selling a card doesn't remove it from your progress. One challenge asks for three in each of the five counties. None of it is urgent before the gate.
    location: Indoors on surfaces and walls, outdoors in yellow phone boxes and on tool boxes.
    sources:
      - url: https://www.powerpyx.com/gta-6-all-collectible-card-sets-locations/
        title: "PowerPyx: GTA 6 collectible card sets and locations"
        accessed: "2026-11-25"
      - url: https://allthings.how/how-many-collectibles-are-in-gta-6-and-where-to-track-them/
        title: "AllThings.how: GTA 6 collectibles guide"
        accessed: "2026-11-25"

  - id: collections-overview
    title: Know what the Collections screen tracks
    category: Collectibles
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: "Progress > Collections has three tabs: Collectible Cards, WAiNK Locations and Exploration. WAiNK scans total 108 in five types (Landmarks 31, Curiosities 35, Sculptures 23, Peewees Billboards 4, No Flusher Tags 15); older 112 and 130 figures are stale. Exploration is eight sub-categories, 296 items in all: underwater discoveries, magazines/books/comics, book swaps, meditation spots, cocaine flamingos, unique playlists, styles, and a five-car Ultimate Edition set. The 100% checklist also sets discovery targets: 200 of 277 base vehicles, 100 of 255 animals and 50 of 66 standard weapons. Only the house magazines and the balcony meditation are tied to this gate."
    location: Pause > Map > Progress > Collections.
    sources:
