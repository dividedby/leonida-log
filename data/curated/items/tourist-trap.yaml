  - id: balcony-meditation
    title: Accept Lucia's balcony invite
    category: Romance
    before_gate: tourist-trap
    visible_after_mission: down-to-earth
    lost_at_mission: tourist-trap
    verified: true
    how_to: The morning after Down to Earth, at Jason's house, say yes when Lucia asks you to meditate on the balcony. It's a nice-to-do. Positive Mental Attitude doesn't depend on it, and players have earned the trophy without it. It takes minutes.
    location: Jason's house.
    sources:
