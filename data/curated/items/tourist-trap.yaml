  - id: relationship-building
    title: Build your relationship with Lucia
    category: Romance
    before_gate: tourist-trap
    visible_after_mission: coming-home
    verified: true
    how_to: Answer her calls and texts, buy her food, drinks and clothes, do activities together and never leave her behind. Check the level in the Jason & Lucia menu. You can't break up for good, as the lowest level is Running on Empty, but VGC says neglect locks you out of one ending.
    sources:
