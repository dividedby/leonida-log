  - id: balcony-meditation
    title: Accept Lucia's balcony invite
    category: Romance
    before_gate: tourist-trap
    visible_after_mission: down-to-earth
    lost_at_mission: tourist-trap
    verified: true
    how_to: The morning after Down to Earth, at Jason's house, say yes when Lucia asks you to meditate on the balcony. It's a nice-to-do you can miss. Positive Mental Attitude doesn't depend on it, and players have earned the trophy without it; if you skip it, Learn to Meditate Together turns up later in the story. Most spots take two sessions, one per character, and 15 of the 18 sessions give 100%. This one takes minutes.
