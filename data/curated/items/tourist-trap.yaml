# Before-you-move-on items for the Tourist Trap gate.
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two independent sources agree or one non-AI source
# states it outright. A single source that is AI-drafted or AI-assisted (The
# Games Wiki says so in its footer; gaming.net too) never counts as that one
# explicit source, so items resting only on it stay verified: false.
# Where guides disagree the item stays verified: false and says so.
# Checking balance: Rock Paper Shotgun and allthings.how both say it is lost, and
# Playtheory's own save and a Project VI video test show the same, so
# empty-checking is verified.
# Lock-in: PowerPyx's Recalibration page says there is no free roam once you
# start Recalibration (two cross-checks read it). Its Tourist Trap page says the
# lock starts when you go to Lucia, and VGC and gtabase tie it to Tourist Trap.
# Items use the earlier, safe line: finish the list and save before you start
# Recalibration. Still verified: false, as every source is one publisher or a
# conflicting guide.
# Not listed, on purpose: the Moreland 850 pickup inside Tourist Trap itself.
# It can't be described without giving away the mission, and it falls after
# the lock-in point.
# Outfits: Playtheory's own save kept only the starting outfit; gameta says
# wardrobe-saved accessories can be had again; IGN's Tourist Trap walkthrough and
# KeenGamer say cosmetics carry over, so bought-outfits stays unverified.
# Donnie's Drop-Off: Game8 says it ends after Swamped; lost_at uses Swamped, the
# safe line.

items:
  - id: manual-save
    title: Make a manual save
    category: General
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: true
    how_to: There's no mission replay, so keep a save you won't overwrite. You get 15 manual slots plus an autosave. Make a fresh one before each point of no return. In Chapter 1, make it during your last free roam, before you start Recalibration; the checklist tells you when that is.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-6-walkthrough-all-chapters-and-story-missions-in-order/
        title: "KeenGamer: GTA 6 walkthrough, all chapters and story missions in order"
        accessed: "2026-11-25"
      - url: https://www.powerpyx.com/gta-6-grand-theft-auto-vi/
        title: "PowerPyx: GTA 6 trophy guide and roadmap"
        accessed: "2026-11-25"

