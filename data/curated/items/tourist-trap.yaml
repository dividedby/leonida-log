        accessed: "2026-11-25"

  - id: floor-stash
    title: Empty the floor stash
    category: Money
    before_gate: tourist-trap
    visible_after_mission: prologue
    lost_at_mission: tourist-trap
    verified: true
    how_to: Before BuckMe exists you can hide cash under the floorboard in Jason's bedroom. If you did, take it back out. Players report that stash money is gone and can't be recovered afterwards. Jason's separate $5,000 Rainy Day lockbox isn't gone for good, per Rock Paper Shotgun, but don't plan around getting it back.
    location: Jason's bedroom.
    sources:
      - url: https://www.rockpapershotgun.com/gta-6-how-to-keep-your-money-at-end-of-chapter-1
        title: "Rock Paper Shotgun: how to keep your money at the end of Chapter 1"
        accessed: "2026-11-25"
      - url: https://www.gtaboom.com/how-to-make-money-fast-and-early-in-gta-6-725c
        title: "GTABoom: how to make money fast and early in GTA 6"
        accessed: "2026-11-25"
