  - id: strength
    title: Train Strength
    category: Stats
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: Lift weights, including the ones on the house terrace, or pay for a studio session. Finish the fitness app workout or the gains don't count.
    location: House terrace weights and paid studios.
    sources:
      - url: https://www.powerpyx.com/gta-6-how-to-increase-character-stats-health-cardio-focus/
        title: "PowerPyx: GTA 6 stats guide"
        accessed: "2026-11-25"

  - id: cardio
    title: Train Cardio
    category: Stats
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: Use the treadmill or a bike, or run, cycle and swim.
    sources:
      - url: https://www.powerpyx.com/gta-6-how-to-increase-character-stats-health-cardio-focus/
        title: "PowerPyx: GTA 6 stats guide"
        accessed: "2026-11-25"

  - id: focus
    title: Train Focus
    category: Focus
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    how_to: Shooting ranges (a small waiver fee, repeatable), golf, pool, fishing, basketball and meditation all raise it. Earned Focus never decays, so this one can wait.
    sources:
      - url: https://www.powerpyx.com/gta-6-how-to-increase-character-stats-health-cardio-focus/
        title: "PowerPyx: GTA 6 stats guide"
