  - id: spend-on-weapons
    title: Spend spare cash on weapons
    category: Money
    before_gate: tourist-trap
    visible_after_mission: buck-me
    verified: true
    how_to: Bought weapons carry past the gate, and unique variants are kept for good, so spare pocket cash is best spent on guns. Weapons you pick up off enemies aren't owned and are lost if you die or get arrested. Whether ammo, attachments and clothes carry over is still unconfirmed.
    location: Ammu-Nation.
    sources:
      - url: https://gamefaqs.gamespot.com/boards/375801-grand-theft-auto-vi/81217002
        title: "GameFAQs GTA VI board: tips thread (player reports)"
