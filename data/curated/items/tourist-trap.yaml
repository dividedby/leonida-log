  - id: focus
    title: Train Focus
    category: Focus
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: true
    how_to: Shooting ranges (a small waiver fee, repeatable), golf, pool, fishing, basketball and meditation all raise it. Unlike Strength and Cardio it has no workout window and no daily cap, and earned Focus never decays, so this one can wait. Polygon says combat adds about 1% per shot, only for hits that match your criminal profile (weak spots or headshots) against hostile enemies. In one player's PS5 save, Jason's Focus kept its level at the next chapter change.
