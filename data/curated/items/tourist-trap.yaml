# Before-you-move-on items for the Tourist Trap gate.
# Text is paraphrased in the app's voice, never copied from a guide.
# verified: true only where two independent sources agree or one non-AI source
# states it outright. A single source that is AI-drafted or AI-assisted (The
# Games Wiki says so in its footer; gaming.net too) never counts as that one
# explicit source, so items resting only on it stay verified: false.
# Where guides disagree (card/WAiNK counts) the item stays verified: false and
# says so.
# Checking balance: Rock Paper Shotgun and allthings.how both say it is lost, so
# empty-checking is verified. Neither is a before/after test; no player has
# compared balances.
# Lock-in: PowerPyx's Recalibration page calls the free roam after Recalibration
# the last in Chapter 1, and its Tourist Trap page says the lock starts when you
# go to Lucia. The point of no return starts there, not at Recalibration.
# Not listed, on purpose: the Moreland 850 pickup inside Tourist Trap itself.
# It can't be described without giving away the mission, and it falls after
# the lock-in point.

items:
  - id: manual-save
    title: Make a manual save
    category: General
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: true
    how_to: There's no mission replay, so keep a save you won't overwrite. You get 15 manual slots plus an autosave. Make a fresh one before each point of no return. In Chapter 1, make it during your last free roam, before the point of no return starts; the checklist tells you when that is.
    sources:
      - url: https://www.keengamer.com/articles/guides/gta-6-walkthrough-all-chapters-and-story-missions-in-order/
        title: "KeenGamer: GTA 6 walkthrough, all chapters and story missions in order"
        accessed: "2026-11-25"
      - url: https://www.powerpyx.com/gta-6-grand-theft-auto-vi/
        title: "PowerPyx: GTA 6 trophy guide and roadmap"
        accessed: "2026-11-25"

