    title: Run your checking balance down
    category: Money
    before_gate: tourist-trap
    visible_after_mission: buck-me
    lost_at_mission: tourist-trap
    verified: true
    how_to: Rock Paper Shotgun and allthings.how both say your BuckMe checking balance is lost and only Family Savings carries over. Spend it on things you'll keep, such as weapons, or move it into Family Savings if you're happy never to take it back out.
    location: The BuckMe app.
    sources:
