  - id: manual-save
    title: Make a manual save
    category: General
    before_gate: tourist-trap
    visible_after_mission: gear-up
    verified: true
    how_to: There's no mission replay, so keep a save you won't overwrite. You get 15 manual slots plus an autosave. Make a fresh one before each point of no return. In Chapter 1, make it during your last free roam, before the point of no return; the checklist tells you when that is.
