        title: "AllThings.how: GTA 6 collectibles guide"
        accessed: "2026-11-25"

  - id: collections-overview
    title: Know what the Collections screen tracks
    category: Collectibles
    before_gate: tourist-trap
    visible_after_mission: prologue
    verified: false
    evidence:
      basis: best-guess
      note: "Guides disagree on whether Street Art, Murals, Kenton's Treasures and Styles are separate tabs. Whether unsold cards are tied to the gate is not settled; they are treated as tied."
    how_to: "Progress > Collections holds Collectible Cards, WAiNK Locations and Exploration. WAiNK scans total 108 in five types (Landmarks 31, Curiosities 35, Sculptures 23, Peewees Billboards 4, No Flusher Tags 15); older 112 and 130 figures are stale. Exploration is eight sub-categories, 296 items in all: underwater discoveries, magazines/books/comics, book swaps, meditation spots, cocaine flamingos, unique playlists, styles, and a five-car Ultimate Edition set. The 100% checklist also sets discovery targets: 200 of 277 base vehicles, 100 of 255 animals and 50 of 66 standard weapons. Only the house magazines, the balcony meditation and any cards you haven't sold are tied to this gate."
    location: Pause menu > Progress > Collections.
