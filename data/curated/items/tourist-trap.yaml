  - id: floor-stash
    title: Empty the floor stash
    category: Money
    before_gate: tourist-trap
    visible_after_mission: prologue
    lost_at_mission: tourist-trap
    verified: true
    how_to: Before BuckMe exists you can hide cash under the floorboard in Jason's bedroom. If you did, take it back out. Players report that stash money is gone and can't be recovered afterwards. Jason's separate $5,000 Rainy Day lockbox can be recovered after the chapter change (Rock Paper Shotgun), unlike cash you hid under the floorboard yourself.
