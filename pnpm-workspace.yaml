# better-sqlite3 13 ships N-API prebuilds (darwin/linux/win, glibc and musl), loaded
# on any Node >=22. The implicit node-gyp build is skipped on purpose.
allowBuilds:
  better-sqlite3: false
  esbuild: false

# drizzle-kit pulls esbuild 0.18 through the deprecated @esbuild-kit loader;
# esbuild <=0.24.2 lets any website read dev-server responses (GHSA-67mh-4wv8-2f99).
overrides:
  "esbuild@<0.25.0": ^0.25.0
